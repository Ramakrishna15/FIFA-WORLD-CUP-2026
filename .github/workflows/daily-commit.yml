name: Daily Commit

on:
  schedule:
    - cron: '0 9 * * *'   # First commit at 9 AM UTC
    - cron: '0 14 * * *'  # Second commit at 2 PM UTC
  workflow_dispatch:       # Allow manual trigger

permissions:
  contents: write

jobs:
  commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
        with:
          ref: main

      - name: Make daily commit
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git remote set-url origin https://x-access-token:${GITHUB_TOKEN}@github.com/Ramakrishna15/FIFA-WORLD-CUP-2026.git
          echo "// Auto update: $(date '+%Y-%m-%d %H:%M:%S')" >> app.js
          git add app.js
          git commit -m "Auto update $(date '+%Y-%m-%d %H:%M')"
          git push origin main
