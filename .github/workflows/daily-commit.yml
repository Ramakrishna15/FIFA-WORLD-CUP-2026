name: Daily Commit

on:
  schedule:
    - cron: '0 9 * * *'   # First commit at 9 AM UTC
    - cron: '0 14 * * *'  # Second commit at 2 PM UTC
  workflow_dispatch:       # Allow manual trigger

jobs:
  commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Make daily commit
        run: |
          git config user.name "Ramakrishna15"
          git config user.email "ramanistalan@gmail.com"
          echo "// Auto update: $(date '+%Y-%m-%d %H:%M:%S')" >> app.js
          git add app.js
          git commit -m "Auto update $(date '+%Y-%m-%d %H:%M')"
          git push
